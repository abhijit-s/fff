[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fff-client"
version = "0.1.0"
description = "Stdlib-only Python client for fff's versioned engine daemon protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhijit Salvi" }]
keywords = ["fff", "file-finder", "frecency", "ipc", "search"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
]
# No runtime dependencies — pure stdlib (socket, json, struct, pathlib, os, typing).
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
