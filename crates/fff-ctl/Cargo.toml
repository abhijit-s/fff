[package]
name = "fff-ctl"
version = "0.19.2"
edition = "2024"
description = "Operator CLI for managing fff-engine daemons — list, stop, status, clean"
license = "MIT"

[[bin]]
name = "fffctl"
path = "src/main.rs"

[dependencies]
fff-ipc = { path = "../fff-ipc", version = "0.19.2" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
fff-ipc = { path = "../fff-ipc", version = "0.19.2" }
libc = "0.2"
