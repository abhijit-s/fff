[package]
name = "fff-mcp"
version = "0.19.4"
edition = "2024"
description = "MCP server for FFF file finder - drop-in replacement for AI code assistant search tools"
license = "MIT"

[lints]
workspace = true

[[bin]]
name = "fff-mcp"
path = "src/main.rs"

[lib]
name = "fff_mcp"
path = "src/lib.rs"

[features]
# Pure-Rust walker by default; opt into zlob explicitly (needs Zig).
default = ["ripgrep"]
ripgrep = ["fff/ripgrep", "fff-query-parser/ripgrep"]
zlob = ["fff/zlob", "fff-query-parser/zlob"]

[dependencies]
fff = { package = "fff-search", path = "../fff-core", default-features = false , version = "0.19.4", features = ["definitions"] }
fff-ipc = { path = "../fff-ipc", version = "0.19.4" }
fff-query-parser = { path = "../fff-query-parser", default-features = false , version = "0.19.4" }
dirs = { workspace = true }
libc = "0.2"
mimalloc = { workspace = true }
rmcp = { version = "1.7.0", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
tokio = { version = "1", features = ["full"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
tracing = { workspace = true }
git2 = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile = "3.8"
libc = "0.2"

# One `fff` .deb bundling the daemon trio. Built with --no-build after a
# workspace build of all three; cargo-deb rewrites target/release -> the
# per-target dir when --target is passed. See scripts/build-apt-repo.sh.
[package.metadata.deb]
name = "fff"
maintainer = "Abhijit Salvi <a.salvi@easygo.io>"
copyright = "2026, ff-labs"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
Fast frecency-ranked file finder for AI code assistants. Ships the daemon \
trio: fff-mcp (MCP server), fff-engine (index-owning daemon), and fffctl \
(operator CLI)."""
assets = [
  ["target/release/fff-mcp", "usr/bin/", "755"],
  ["target/release/fff-engine", "usr/bin/", "755"],
  ["target/release/fffctl", "usr/bin/", "755"],
]
